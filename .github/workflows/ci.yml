name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TMPDIR: ${{ github.workspace }}/.task-tmp

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Windows stays on GitHub-hosted. Linux uses the CI_LINUX_RUNNER (Blacksmith)
    # for same-repo events; pull requests from forks stay on GitHub-hosted runners.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      # TMPDIR is job-wide; create it before any step (rust-toolchain runs mktemp) uses it.
      - run: mkdir -p "$TMPDIR"
        shell: bash
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo package --locked
        if: runner.os == 'Linux'
