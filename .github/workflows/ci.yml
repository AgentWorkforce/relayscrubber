name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TMPDIR: ${{ github.workspace }}/.task-tmp

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Windows stays on GitHub-hosted. Linux uses the CI_LINUX_RUNNER (Blacksmith)
    # for same-repo events; pull requests from forks stay on GitHub-hosted runners.
    runs-on: ${{ matrix.os == 'windows-latest' && 'windows-latest' || ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      # TMPDIR is job-wide; create it before any step (rust-toolchain runs mktemp) uses it.
      - run: mkdir -p "$TMPDIR"
        shell: bash
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features --locked -- --show-output
      - name: Require zero missed secrets in frozen witnesses
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --example scrub_lines
          python3 scripts/check-frozen-witnesses.py target/debug/examples/scrub_lines target/debug/examples/scrub_lines
      - run: cargo package --locked
        if: runner.os == 'Linux'

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: bash scripts/build-wasm.sh
      - name: Generate synthetic native parity vectors privately
        run: |
          mkdir -p "$HOME/scrubber-eval"
          chmod 700 "$HOME/scrubber-eval"
          umask 077
          cargo run --release --locked --example wasm_vectors > "$HOME/scrubber-eval/wasm-vectors.json"
          cargo build --release --locked --example scrub_lines
          python3 scripts/check-frozen-witnesses.py target/release/examples/scrub_lines target/release/examples/scrub_lines "$HOME/scrubber-eval/wasm-vectors.json"
      - run: node --test js/test/*.test.mjs
      - run: bun test js/test/*.test.mjs
      - run: bash scripts/check-reproducible.sh
      - run: bash scripts/test-workers.sh
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Package the WASM adapter locally
        run: |
          mkdir -p target/wasm-package
          cd js
          npm pack --ignore-scripts --pack-destination ../target/wasm-package
      - name: Check hosted artifact against committed pin
        run: node scripts/check-hosted-artifact.mjs target/wasm-package/agentworkforce-relayscrubber-0.5.0-alpha.6.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relayscrubber-wasm-candidate
          path: |
            target/wasm-package/*.tgz
            js/generated/artifact.json
          retention-days: 7
