name: Publish

# Publishes relayscrubber to crates.io with Trusted Publishing: the job mints a
# short-lived crates.io token from GitHub OIDC (rust-lang/crates-io-auth-action),
# so no long-lived registry token is stored in this repository.
# One-time setup on crates.io (after the first manual publish): add
# AgentWorkforce/relayscrubber, workflow publish.yml, environment crates-io as a
# trusted publisher for the relayscrubber crate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TMPDIR: ${{ github.workspace }}/.task-tmp

jobs:
  publish:
    name: Publish relayscrubber to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Actions and their helper scripts inherit TMPDIR too. Create it before
      # rust-toolchain invokes mktemp, not after toolchain setup.
      - name: Create task temp directory
        run: mkdir -p "$TMPDIR"
      - uses: dtolnay/rust-toolchain@stable
      - name: Read crate version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "relayscrubber") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - name: Test
        run: cargo test --all-targets --all-features --locked
      - name: Package (dry run)
        run: cargo publish --locked --dry-run
      - name: Skip if this version is already on crates.io
        id: crate-gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'relayscrubber-publish (github.com/AgentWorkforce/relayscrubber)' "https://crates.io/api/v1/crates/relayscrubber/${VERSION}")"
          case "${status}" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "relayscrubber ${VERSION} already on crates.io; skip" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io lookup returned HTTP ${status}; not publishing"; exit 1 ;;
          esac
      - name: Authenticate with crates.io
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: ${{ (github.event_name == 'push' || !inputs.dry_run) && steps.crate-gate.outputs.exists != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked --no-verify
