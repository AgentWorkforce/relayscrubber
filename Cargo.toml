[package]
name = "relayscrubber"
version = "0.5.0-alpha.3"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Deterministic Technical Foul secret and PII scrubbing for Agent Relay"
repository = "https://github.com/AgentWorkforce/relayscrubber"
readme = "README.md"
keywords = ["redaction", "secrets", "pii", "agent-relay"]
categories = ["text-processing"]
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "scripts/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "build.rs",
  "docs/**",
  "eval/**",
  "MIGRATION.md",
  "rust-toolchain.toml",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
aho-corasick = "=1.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
base64 = "=0.22.1"
wasm-bindgen = { version = "=0.2.104", optional = true }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
proptest = "1.9"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
