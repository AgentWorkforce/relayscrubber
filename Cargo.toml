[package]
name = "relayscrubber"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Deterministic Technical Foul secret and PII scrubbing for Agent Relay"
repository = "https://github.com/AgentWorkforce/relayscrubber"
readme = "README.md"
keywords = ["redaction", "secrets", "pii", "agent-relay"]
categories = ["text-processing"]
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "scripts/**",
  "vendor/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.9"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
# The rule modules intentionally mirror the reviewed JavaScript/Desktop control
# flow. Pedantic style rewrites would make security audits harder to compare.
